<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrailLens - Post-Adventure Logbook</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
            --danger: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 15px;
        }
        header h1 {
            font-size: 2.3rem;
            color: var(--primary);
            margin-bottom: 5px;
        }
        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        .badge {
            display: inline-block;
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 8px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .clear-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            width: auto;
            cursor: pointer;
        }
        .clear-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }
        .trail-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .trail-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            animation: fadeIn 0.3s ease-in-out;
        }
        .trail-card h3 {
            margin-bottom: 5px;
            color: #f1f5f9;
            font-size: 1.1rem;
        }
        .trail-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 8px;
            white-space: pre-wrap;
        }
        .date-tag {
            font-size: 0.75rem;
            color: #64748b;
        }
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>TrailLens 🌲</h1>
        <p>Post-Adventure Outdoor Logbook</p>
        <div class="badge">🌱 Hacktoberfest 2026: Touch Grass Theme</div>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="trailName">Trail / Location Name</label>
            <input type="text" id="trailName" placeholder="e.g., Pine Valley Trail, City Park">
        </div>
        <div class="form-group">
            <label for="trailDesc">Adventure Notes & Memories</label>
            <textarea id="trailDesc" rows="3" placeholder="How was the trip? What did you spot or experience after stepping outside?"></textarea>
        </div>
        <button onclick="addTrail()">Log Adventure</button>

        <div class="stats-bar">
            <span id="statsText">Total Logs: 0</span>
            <button class="clear-btn" onclick="clearAllTrails()" id="clearBtn" style="display:none;">Clear History</button>
        </div>

        <div class="trail-list" id="trailList">
            <div class="empty-state">No adventures logged yet. Go touch grass and record your first trip!</div>
        </div>
    </div>

    <script>
        // Load saved entries on startup
        let trails = JSON.parse(localStorage.getItem('traillens_entries')) || [];

        function renderTrails() {
            const listContainer = document.getElementById('trailList');
            const statsText = document.getElementById('statsText');
            const clearBtn = document.getElementById('clearBtn');

            statsText.innerText = `Total Logs: ${trails.length}`;

            if (trails.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">No adventures logged yet. Go touch grass and record your first trip!</div>';
                clearBtn.style.display = 'none';
                return;
            }

            clearBtn.style.display = 'block';
            listContainer.innerHTML = '';

            trails.forEach((trail) => {
                const card = document.createElement('div');
                card.className = 'trail-card';
                card.innerHTML = `
                    <h3>📍 ${escapeHtml(trail.name)}</h3>
                    <p>${escapeHtml(trail.desc)}</p>
                    <span class="date-tag">🗓️ Logged on: ${trail.date}</span>
                `;
                listContainer.appendChild(card);
            });
        }

        function addTrail() {
            const nameInput = document.getElementById('trailName');
            const descInput = document.getElementById('trailDesc');
            
            const name = nameInput.value.trim();
            const desc = descInput.value.trim();

            if (!name || !desc) {
                alert('Please fill in both fields before logging!');
                return;
            }

            const newEntry = {
                name: name,
                desc: desc,
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' })
            };

            trails.unshift(newEntry); // Add to beginning of array
            localStorage.setItem('traillens_entries', JSON.stringify(trails));

            nameInput.value = '';
            descInput.value = '';

            renderTrails();
        }

        function clearAllTrails() {
            if (confirm('Are you sure you want to clear all your logged adventures?')) {
                trails = [];
                localStorage.removeItem('traillens_entries');
                renderTrails();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Initial render on page load
        renderTrails();
    </script>
</body>
  </html>
